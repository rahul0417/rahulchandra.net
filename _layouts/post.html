---
layout: default
---
<article class="post">
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
    {% if page.topic %}<span class="topic">{{ page.topic }}</span>{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  <div class="body">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">← All notes</a></p>
</article>
